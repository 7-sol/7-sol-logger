apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "log-receiver.fullname" . }}
  labels:
    {{- include "log-receiver.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "log-receiver.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "log-receiver.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: management
              containerPort: 8081
              protocol: TCP
          env:
            - name: MONGO_URI
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.env.mongoUriFromConfig }}
                  key: {{ .Values.env.mongoUriKey }}
            - name: NATS_URI
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.env.natsUriFromConfig }}
                  key: {{ .Values.env.natsUriKey }}
            - name: NATS_SUBJECT
              value: {{ .Values.config.natsSubject }}
            - name: APP_LOGGING_RETENTION_DAYS
              value: {{ .Values.config.retentionDays | quote }}
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
