apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: log-receiver
build:
  artifacts:
    - image: log-receiver
      ko:
        main: .
manifests:
  helm:
    releases:
      - name: log-receiver
        chartPath: charts/log-receiver
        valuesFiles:
          - charts/log-receiver/values.yaml
        setValueTemplates:
          image.repository: "{{.IMAGE_REPO_log_receiver}}"
          image.tag: "{{.IMAGE_TAG_log_receiver}}"
deploy:
  kubectl: {}
