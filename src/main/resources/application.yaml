# Server Configuration
server:
  port: 8088
  shutdown: graceful

# Management Configuration
management:
  server.port: 8081
  endpoints:
    web.exposure.include: health,prometheus,loggers
  endpoint:
    health.show-details: always

# MongoDB Configuration
# We rely on SPRING_MONGODB_USERNAME and SPRING_MONGODB_PASSWORD
# environment variables for authentication, which are mapped in the Helm chart.
spring:
  threads:
    virtual:
      enabled: true
  main:
    web-application-type: servlet
  application:
    name: 'logger'
  mongodb:
    uri: 'mongodb://${SPRING_MONGODB_USERNAME:ais_user}:${SPRING_MONGODB_PASSWORD:ais-user-password}@${MONGO_HOSTS:localhost:27017}/${MONGO_DATABASE:ais}?replicaSet=${REPLICA_SET:rs0}&authSource=${MONGO_DATABASE:ais}'

# NATS Configuration
nats:
  url: ${NATS_URL:nats://localhost:4222}
  subject: ${NATS_SUBJECT:audit.logs}

# Logging Retention
# (Mappings now directly use environment variables in Java code)
app:
  logging:
    retention:
      days: ${APP_LOGGING_RETENTION_DAYS:90}