# Server Configuration
server.port=8080
server.shutdown=graceful

# Management Configuration
management.server.port=8081
management.endpoints.web.exposure.include=health,prometheus,loggers
management.endpoint.health.show-details=always

# MongoDB Configuration
# Note: spring.data.mongodb.uri takes precedence if set.
# To support user/password injection via separate env vars while
# still allowing a base URI (host/port/db), we use individual properties.
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/logger}
spring.data.mongodb.username=${MONGO_USER:}
spring.data.mongodb.password=${MONGO_PASSWORD:}

# NATS Configuration
app.nats.uri=${NATS_URI:nats://localhost:4222}

# Logging Retention
# (Mappings now directly use environment variables in Java code)
