# Server Configuration
server.port=8080
server.shutdown=graceful

# Management Configuration
management.server.port=8081
management.endpoints.web.exposure.include=health,prometheus,loggers
management.endpoint.health.show-details=always

# MongoDB Configuration
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/logger}

# NATS Configuration
app.nats.uri=${NATS_URI:nats://localhost:4222}
app.nats.subject=${NATS_SUBJECT:audit.logs}

# Logging Retention
app.logging.retention-days=90

# Jackson Configuration
# spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
